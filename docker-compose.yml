version: "3.9"

# FlowETL Stack: Web Application + PostgreSQL + MySQL
#
# Usage:
#   docker compose up -d          # start all services including app
#   docker compose ps             # check health status
#   docker compose down -v        # stop and remove volumes

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowetl_app
    restart: unless-stopped
    ports:
      - "${FLOWETL_PORT:-8000}:8000"
    environment:
      - FLOWETL_ENV=production
      - FLOWETL_HOST=0.0.0.0
      - FLOWETL_PORT=8000
      - MYSQL_HOST=mysql
      - POSTGRES_HOST=postgres
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: flowetl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flowetl_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospital_db}
      MYSQL_USER: ${MYSQL_USER:-flowetl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flowetl_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-flowetl_root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: flowetl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-hospital_dw}
      POSTGRES_USER: ${PG_USER:-flowetl}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-flowetl_pass}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER:-flowetl} -d ${PG_DATABASE:-hospital_dw}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
